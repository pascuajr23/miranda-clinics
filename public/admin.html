<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Miranda Clinics Admin</title>
    <link rel="stylesheet" href="/original.css" />
    <link rel="icon" href="/assets/logo-only.ico" type="image/x-icon" />
    <style>
      .go-control { display: block; padding: 2.2rem 1.5rem; border-radius: 24px; background: #133f54; color: #fff; text-decoration: none; text-align: center; box-shadow: 0 18px 40px rgba(19, 63, 84, 0.25); }
      .go-control strong { display: block; font-size: clamp(1.6rem, 4vw, 2.2rem); }
      .go-control span { opacity: 0.8; }
      .go-control:hover { background: #0f3446; }
      .quick-links { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
      .admin-section { margin-top: 3rem; }
      .tabs { display: none; gap: 6px; justify-content: center; flex-wrap: wrap; margin: 0 0 2rem; }
      body.is-admin .tabs { display: flex; }
      .tabs button { border: 1px solid #d2dce8; background: #fff; color: #133f54; border-radius: 999px; padding: 0.6rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer; }
      .tabs button.active { background: #133f54; border-color: #133f54; color: #fff; }
      [data-panel] { display: none; }
      [data-panel].active { display: block; }
      .room-card input[type="date"] { width: 100%; padding: 0.8rem 1rem; border-radius: 12px; border: 1px solid #d2dce8; background: #f8fafc; color: #102a43; font: inherit; }
      #closureForm { max-width: 520px; margin: 0 auto; }
      .plain-list { list-style: none; padding: 0; margin: 1.5rem auto 0; max-width: 720px; display: grid; gap: 8px; }
      .plain-list li { display: flex; gap: 12px; align-items: center; justify-content: space-between; background: #fff; border-radius: 14px; padding: 0.8rem 1rem; box-shadow: 0 6px 18px rgba(15, 23, 42, 0.06); }
      .plain-list time, .plain-list .who { color: #64748b; font-size: 0.9rem; white-space: nowrap; }
      .plain-list button { border: none; background: none; color: #b33636; font: inherit; font-weight: 600; cursor: pointer; }
      .standby { text-align: center; color: #475569; margin: 0 0 1.5rem; }
      .admin-section > h2 { color: #0f172a; margin: 0 0 1rem; }
      .room-card input[type="password"], .room-card textarea, .room-card select { width: 100%; padding: 0.8rem 1rem; border-radius: 12px; border: 1px solid #d2dce8; background: #f8fafc; color: #102a43; font: inherit; }
      .room-card textarea { min-height: 96px; resize: vertical; }
      .room-card .hint { margin: 0.3rem 0 0; color: #64748b; font-size: 0.9rem; }
      .room-card .checks { display: grid; gap: 6px; }
      .room-card .group-label { display: block; margin: 1rem 0 0.45rem; color: #475569; font-weight: 600; }
      .room-card h2, .plain-list span { overflow-wrap: anywhere; min-width: 0; }
      .room-card .checks label { display: flex; gap: 8px; align-items: center; margin: 0; font-weight: 500; }
      .room-card .checks input { width: auto; flex: none; margin: 0; }
      .room-card .remove { background: transparent !important; color: #b33636 !important; box-shadow: none !important; }
      .room-card .tag { font-size: 0.8rem; font-weight: 700; color: #133f54; background: #e6f0f5; padding: 2px 10px; border-radius: 999px; vertical-align: middle; }
      .add-card { width: 100%; min-height: 120px; border: 2px dashed #9fb3c8; border-radius: 18px; background: transparent; font: inherit; font-weight: 700; color: #133f54; cursor: pointer; }
      .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 12px 20px; border-radius: 999px; background: #0f172a; color: #fff; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 2000; }
      .toast.show { opacity: 1; }
      .toast.error { background: #b33636; }
    </style>
  </head>
  <body class="control-page">
    <div class="login-overlay hidden" id="loginView">
      <div class="login-card">
        <h2>Access required</h2>
        <p>Sign in to continue.</p>
        <form id="loginForm">
          <label for="usernameInput">Username</label>
          <input id="usernameInput" name="username" type="text" autocomplete="username" autocapitalize="none" required />
          <label for="passwordInput">Password</label>
          <input id="passwordInput" name="password" type="password" autocomplete="current-password" required />
          <button type="submit">Login</button>
          <p class="login-error" id="loginError" role="alert"></p>
        </form>
      </div>
    </div>

    <div class="app-content hidden" id="panelView">
      <header class="site-header scrolled">
        <a href="/" class="brand">
          <img src="/assets/logo-96.png" alt="Miranda Clinics logo" class="brand-logo" width="38" height="38" />
          <span class="brand-text">Miranda Clinics</span>
        </a>
        <div class="header-right">
          <nav class="nav-links">
            <a href="/#about">About</a>
            <a href="/#services">Services</a>
            <a href="/#schedule">Schedule</a>
            <a href="/#contact">Contact</a>
          </nav>
          <button type="button" class="login-btn" id="logoutBtn">Logout</button>
        </div>
      </header>

      <main class="page-shell">
        <section class="panel">
          <h1 id="greeting">Admin</h1>
        </section>

        <nav class="tabs" role="tablist" aria-label="Admin sections" data-admin-only>
          <button type="button" role="tab" id="tab-main" aria-controls="panel-main" data-tab="main">Main</button>
          <button type="button" role="tab" id="tab-announcement" aria-controls="panel-announcement" data-tab="announcement">Announcement</button>
          <button type="button" role="tab" id="tab-doctors" aria-controls="panel-doctors" data-tab="doctors">Doctors</button>
          <button type="button" role="tab" id="tab-rooms" aria-controls="panel-rooms" data-tab="rooms">Rooms</button>
          <button type="button" role="tab" id="tab-closures" aria-controls="panel-closures" data-tab="closures">Closures</button>
          <button type="button" role="tab" id="tab-staff" aria-controls="panel-staff" data-tab="staff">Staff</button>
          <button type="button" role="tab" id="tab-activity" aria-controls="panel-activity" data-tab="activity">Activity</button>
        </nav>

        <div data-panel="main" role="tabpanel" id="panel-main" aria-labelledby="tab-main">
          <a class="go-control" href="/control">
            <strong>Queue control</strong>
            <span>Call numbers and set doctor in or out</span>
          </a>
          <div class="quick-links">
            <a class="login-btn" href="/queue" target="_blank" rel="noopener">Open TV display</a>
          </div>

          <section class="admin-section" id="passwordSection">
            <h2>Your password</h2>
            <form class="room-card" id="passwordForm">
              <label>Current password</label><input type="password" name="current" autocomplete="current-password" required />
              <label>New password</label><input type="password" name="password" autocomplete="new-password" minlength="8" required />
              <button type="submit">Change password</button>
            </form>
          </section>
        </div>

        <div data-panel="announcement" role="tabpanel" id="panel-announcement" aria-labelledby="tab-announcement">
          <form class="room-card" id="announcementForm">
            <label>Title</label><input type="text" name="title" maxlength="200" />
            <label>Details</label><input type="text" name="details" maxlength="200" />
            <label>Hours</label><input type="text" name="hours" maxlength="200" />
            <button type="submit">Save announcement</button>
          </form>
        </div>

        <div data-panel="doctors" role="tabpanel" id="panel-doctors" aria-labelledby="tab-doctors">
          <div class="rooms-grid" id="doctors"></div>
        </div>

        <div data-panel="rooms" role="tabpanel" id="panel-rooms" aria-labelledby="tab-rooms">
          <p class="standby" id="standby"></p>
          <div class="rooms-grid" id="roomList"></div>
        </div>

        <div data-panel="closures" role="tabpanel" id="panel-closures" aria-labelledby="tab-closures">
          <form class="room-card" id="closureForm">
            <label>Closed on</label><input type="date" name="date" required />
            <label>Note</label><input type="text" name="note" maxlength="80" placeholder="e.g. Christmas Day" />
            <button type="submit">Add closure</button>
          </form>
          <ul class="plain-list" id="closureList"></ul>
        </div>

        <div data-panel="activity" role="tabpanel" id="panel-activity" aria-labelledby="tab-activity">
          <ul class="plain-list" id="activityList"></ul>
        </div>

        <div data-panel="staff" role="tabpanel" id="panel-staff" aria-labelledby="tab-staff">
          <div class="rooms-grid" id="users"></div>
        </div>
      </main>
    </div>

    <div class="toast" id="toast" role="status"></div>

    <script src="/common.js"></script>
    <script src="/admin.js"></script>
  </body>
</html>
