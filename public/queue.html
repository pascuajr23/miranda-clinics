<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Miranda Clinics Queue</title>
    <link rel="stylesheet" href="/original.css" />
    <link rel="icon" href="/assets/logo-only.ico" type="image/x-icon" />
    <style>
      /* More rooms than the original two: 3 across on wide screens. */
      @media (min-width: 901px) { .rooms.three { grid-template-columns: repeat(3, 1fr); } }
      .room-message { margin-top: 0.6em; font-weight: 700; font-size: clamp(16px, 2.4vh, 32px); color: #b45309; text-align: center; }
      .closed-banner { margin: 12px auto 0; max-width: 1180px; padding: 0.8em 1.2em; border-radius: 14px; background: #fef3c7; color: #92400e; font-weight: 700; text-align: center; font-size: clamp(16px, 2.6vh, 34px); }
      .closed-banner[hidden] { display: none; }
    </style>
  </head>
  <body class="queue-page">
    <div class="container">
      <header class="site-header scrolled">
        <a href="/" class="brand">
          <img src="/assets/logo-96.png" alt="Miranda Clinics logo" class="brand-logo" width="38" height="38" />
          <span class="brand-text">Miranda Clinics</span>
        </a>
        <nav class="nav-links">
          <a href="/#about">About</a>
          <a href="/#services">Services</a>
          <a href="/#schedule">Schedule</a>
          <a href="/#contact">Contact</a>
        </nav>
      </header>

      <p class="closed-banner" id="closedBanner" hidden></p>
      <main>
        <div class="rooms" id="queueRoot"></div>
      </main>

      <footer>
        <h1>Now Serving</h1>
        <p>Please proceed when your number is displayed.</p>
      </footer>
    </div>

    <script>
      const queueRoot = document.getElementById('queueRoot');
      const esc = (s) => String(s).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
      // Room colour setting → the original site's palette.
      const COLORS = { blue: '#0d6efd', green: '#15803d', purple: '#7c3aed', orange: '#c2410c' };

      async function loadQueue() {
        try {
          // Rooms without a doctor (spare rooms) stay off the screen.
          const rooms = (await (await fetch('/api/rooms', { cache: 'no-store' })).json()).filter((r) => r.doctorId);
          queueRoot.classList.toggle('two', rooms.length <= 2); // the usual day: big two-doctor layout
          queueRoot.classList.toggle('many', rooms.length > 3); // two rows: smaller numbers
          queueRoot.classList.toggle('three', rooms.length === 3 || rooms.length > 4); // 4 rooms stay 2x2
          queueRoot.innerHTML = rooms.map((r) => {
            const color = COLORS[r.color] || COLORS.blue;
            return `
            <div class="room-card">
              <div class="room-header">
                <div class="room-name" style="color:${color}">${esc((r.department || r.name).toUpperCase())}</div>
                <div class="status ${r.doctorIn ? 'status-in' : 'status-out'}">${r.doctorIn ? 'Doctor is IN' : 'Doctor is OUT'}</div>
              </div>
              <div class="info"><strong style="color:${color}">${esc(r.doctor || r.name)}</strong></div>
              <div class="serving">
                <small>CURRENTLY SERVING</small>
                <div class="queue-number" style="color:${color}">${String(r.number).padStart(3, '0')}</div>
              </div>
              ${r.message ? `<div class="room-message">${esc(r.message)}</div>` : ''}
            </div>`;
          }).join('') || '<p>No rooms are open.</p>';
        } catch (error) {
          console.error(error); // keep the last numbers on screen
        }
      }

      // Banner on days the clinic is closed (dates are clinic time, Asia/Manila).
      async function loadClosure() {
        try {
          const { closures } = await (await fetch('/api/site', { cache: 'no-store' })).json();
          const today = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Manila' });
          const closed = closures.find((c) => c.date === today);
          const banner = document.getElementById('closedBanner');
          banner.hidden = !closed;
          if (closed) banner.textContent = `Closed today${closed.note ? ` · ${closed.note}` : ''}`;
        } catch {}
      }

      loadQueue();
      loadClosure();
      setInterval(loadQueue, 2000);
      setInterval(loadClosure, 60000);
    </script>
  </body>
</html>
