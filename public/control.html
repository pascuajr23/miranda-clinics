<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Miranda Clinic Queue Control</title>
    <link rel="stylesheet" href="/original.css" />
    <link rel="icon" href="/assets/logo-only.ico" type="image/x-icon" />
    <style>
      /* Pieces the original panel didn't have: editable details, colour, add/remove rooms, notices. */
      .panel-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
      .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 12px 20px; border-radius: 999px; background: #0f172a; color: #fff; opacity: 0; pointer-events: none; transition: opacity .2s; }
      .toast.show { opacity: 1; }
      .toast.error { background: #b33636; }
    </style>
  </head>
  <body class="control-page">
    <div class="app-content hidden" id="panelView">
      <header class="site-header scrolled">
        <a href="/" class="brand">
          <img src="/assets/logo-only.png" alt="Miranda Clinics logo" class="brand-logo" />
          <span class="brand-text">Miranda Clinics</span>
        </a>
        <div class="header-right">
          <nav class="nav-links">
            <a href="/#about">About</a>
            <a href="/#services">Services</a>
            <a href="/#schedule">Schedule</a>
            <a href="/#contact">Contact</a>
          </nav>
          <a class="login-btn" href="/admin">Admin</a>
        </div>
      </header>

      <main class="page-shell">
        <section class="panel">
          <h1>Queue Control</h1>
          <p id="panelHint">Update queue numbers for each room</p>
          <div class="panel-actions">
            <a class="login-btn" href="/queue" target="_blank" rel="noopener">Open TV display</a>
            <button type="button" class="login-btn" id="resetAllBtn">Reset all to 000</button>
          </div>
        </section>

        <section class="rooms-grid" id="rooms"></section>
      </main>
    </div>

    <div class="toast" id="toast" role="status"></div>

    <script src="/common.js"></script>
    <script src="/control.js"></script>
  </body>
</html>
