<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Miranda Clinic Queue Control</title>
    <link rel="stylesheet" href="/original.css" />
    <link rel="icon" href="/assets/logo-only.ico" type="image/x-icon" />
    <style>
      /* Pieces the original panel didn't have: editable details, colour, add/remove rooms, notices. */
      .room-card .details { margin-top: 14px; display: grid; gap: 6px; }
      .room-card .details input[type="text"], .room-card select { width: 100%; }
      .room-card .remove { background: transparent !important; color: #b33636 !important; box-shadow: none !important; }
      .add-room { width: 100%; min-height: 120px; border: 2px dashed #9fb3c8; border-radius: 18px; background: transparent; font: inherit; font-weight: 700; color: #133f54; cursor: pointer; }
      .panel-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
      .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 12px 20px; border-radius: 999px; background: #0f172a; color: #fff; opacity: 0; pointer-events: none; transition: opacity .2s; }
      .toast.show { opacity: 1; }
      .toast.error { background: #b33636; }
    </style>
  </head>
  <body class="control-page">
    <div class="login-overlay hidden" id="loginView">
      <div class="login-card">
        <h2>Access required</h2>
        <p>Enter your admin credentials to continue.</p>
        <form id="loginForm">
          <label for="usernameInput">Username</label>
          <input id="usernameInput" name="username" type="text" autocomplete="username" required />
          <label for="passwordInput">Password</label>
          <input id="passwordInput" name="password" type="password" autocomplete="current-password" required />
          <button type="submit">Login</button>
          <p class="login-error" id="loginError" role="alert"></p>
        </form>
      </div>
    </div>

    <div class="app-content hidden" id="panelView">
      <header class="site-header scrolled">
        <a href="/" class="brand">
          <img src="/assets/logo-only.png" alt="Miranda Clinics logo" class="brand-logo" />
          <span class="brand-text">Miranda Clinics</span>
        </a>
        <div class="header-right">
          <nav class="nav-links">
            <a href="/#about">About</a>
            <a href="/#services">Services</a>
            <a href="/#schedule">Schedule</a>
            <a href="/#contact">Contact</a>
          </nav>
          <button type="button" class="login-btn" id="logoutBtn">Logout</button>
        </div>
      </header>

      <main class="page-shell">
        <section class="panel">
          <h1>Admin Control Panel</h1>
          <p>Update queue numbers for each room</p>
          <div class="panel-actions">
            <a class="login-btn" href="/queue" target="_blank" rel="noopener">Open TV display</a>
            <button type="button" class="login-btn" id="resetAllBtn">Reset all to 000</button>
          </div>
        </section>

        <section class="rooms-grid" id="rooms"></section>
      </main>
    </div>

    <div class="toast" id="toast" role="status"></div>

    <script src="/control.js"></script>
  </body>
</html>
